<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>株うら Web版</title>
</head>
<body>

    <h2>株うら Web版</h2>

    <form action="/upload" method="POST">
        <label>銘柄コード（4桁）:</label>
        <input type="text" name="code" maxlength="4" required>
        <button type="submit">確定</button>
    </form>

    <form action="/clear" method="GET">
        <button type="submit">クリアする</button>
    </form>


    {% if result %}
        <h2>占い結果</h2>
        <p style="white-space: pre-line;">{{ result }}</p>
    {% endif %}

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}


</body>
</html>
