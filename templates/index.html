<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>株うら Web版</title>
</head>
<body>

<h2>CSVアップロード</h2>

<form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="csv_file">
    <button type="submit">読み込む</button>
</form>

<form action="/clear" method="GET">
    <button type="submit">クリアする</button>
</form>


{% if table_html %}
    <h3>読み込み結果</h3>
    {{ table_html | safe }}
{% endif %}

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}


</body>
</html>
